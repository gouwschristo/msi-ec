# Kernels built with clang (CachyOS, some Arch kernels) need LLVM=1.
# Change to "make" on gcc-built kernels.
MAKE[0]="make LLVM=1"
CLEAN="make clean"
PACKAGE_NAME="msi-ec-ng"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="msi-ec-ng"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
AUTOINSTALL="yes"